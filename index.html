<script>
function generateStars(count, minSize, maxSize, opacity) {
    const shadows = [];
    for (let i = 0; i < count; i++) {
        const x = Math.floor(Math.random() * 2000);
        const y = Math.floor(Math.random() * 2000);
        const size = (Math.random() * (maxSize - minSize) + minSize).toFixed(1);
        const op = (Math.random() * 0.5 + opacity).toFixed(2);
        shadows.push(`${x}px ${y}px 0 ${size}px rgba(255,255,255,${op})`);
    }
    return shadows.join(', ');
}

const layer1 = document.getElementById('star-layer-1');
const layer2 = document.getElementById('star-layer-2');
const layer3 = document.getElementById('star-layer-3');

layer1.style.boxShadow = generateStars(200, 0, 0.5, 0.3);
layer2.style.boxShadow = generateStars(100, 0.5, 1, 0.4);
layer3.style.boxShadow = generateStars(40, 1, 1.5, 0.6);

// One blue star
layer3.style.boxShadow += ', 800px 400px 0 2px rgba(100,181,246,0.8)';
</script>
